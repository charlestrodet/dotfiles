# vim:fileencoding=utf-8

# General
# Theme
# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
kitty_mod ctrl+shift
shell fish
copy_on_select clipboard

# Source tmux configuration
map ctrl+alt+f5 launch --type=background tmux source-file "$HOME/.tmux.conf"

# Tab
# Kitty tabs
map kitty_mod+t new_tab
map ctrl+[ previous_tab
map ctrl+] next_tab
map kitty_mod+[ move_tab_backward
map kitty_mod+] move_tab_forward

# tmux sub-tabs
map kitty_mod+w send_text all \x1b[5;30012~
map alt+[ send_text all \x01p
map alt+] send_text all \x01n
map alt+0x5b send_text all \x01p
map alt+0x5d send_text all \x01n
map alt+shift+[ send_text all \x1b[5;30013~
map alt+shift+] send_text all \x1b[5;30014~
map alt+shift+0x5b send_text all \x1b[5;30013~
map alt+shift+0x5d send_text all \x1b[5;30014~

# Window
# Pass pane actions to tmux; both split variants inherit the current directory.
map kitty_mod+enter send_text all \x1b[5;30000~
map kitty_mod+\ send_text all \x1b[5;30001~
map kitty_mod+alt+enter send_text all \x1b[5;30002~
map kitty_mod+alt+\ send_text all \x1b[5;30003~
map kitty_mod+left send_text all \x1b[5;30004~
map kitty_mod+right send_text all \x1b[5;30005~
map kitty_mod+up send_text all \x1b[5;30006~
map kitty_mod+down send_text all \x1b[5;30007~
map kitty_mod+f send_text all \x1b[5;30008~

# Display
# Kitty tab bar
tab_bar_edge top
tab_bar_style fade
tab_bar_min_tabs 1
tab_fade 0.25 0.5 0.75 1

# Spacing
window_padding_width 4
window_margin_width 0
