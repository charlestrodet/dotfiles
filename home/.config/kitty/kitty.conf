# vim:fileencoding=utf-8

# General
# Theme
# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
kitty_mod ctrl+shift
shell .
copy_on_select clipboard
env KITTY_TMUX_PROJECTS

# Tab
# Kitty tabs
map kitty_mod+t new_tab
map kitty_mod+alt+t set_tab_title
map kitty_mod+q close_tab
map ctrl+[ previous_tab
map ctrl+] next_tab
map kitty_mod+[ move_tab_backward
map kitty_mod+] move_tab_forward

# First Kitty process owns the project profile and its rename action.
geninclude project_mode.py

# Window
# New OS windows get their own project/plain role.
map kitty_mod+n launch --type=background kitty

# Spacing
window_padding_width 4
window_margin_width 0

# Display
# Kitty tab bar
tab_bar_edge top
tab_bar_style fade
tab_bar_min_tabs 1
tab_fade 0.25 0.5 0.75 1
