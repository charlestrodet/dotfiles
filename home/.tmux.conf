# General
set -g prefix C-a
unbind -q C-b
bind C-a send-prefix
set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
unbind -nq User11
bind -n C-M-F5 source-file ~/.tmux.conf

# Tabs
set -g status on
set -g status-position top
set -g status-style 'bg=#282a36,fg=#6272a4'
set -g status-left ''
set -g status-right ''
set -g window-status-separator ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'bg=#282a36,fg=#6272a4'
set -g window-status-current-style 'bg=#bd93f9,fg=#282a36,bold'
unbind -nq M-Left
unbind -nq M-Right
unbind -nq User9
unbind -nq User10
bind -r Left select-pane -L
bind -r Right select-pane -R
bind c new-window -c '#{pane_current_path}'
set -s user-keys[12] "\e[5;30012~"
bind -n User12 kill-window
set -s user-keys[13] "\e[5;30013~"
set -s user-keys[14] "\e[5;30014~"
bind -n User13 swap-window -d -s : -t '{previous}'
bind -n User14 swap-window -d -s : -t '{next}'

# Panes
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9'
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind = select-layout -E

# Kitty key relay: split, swap, zoom
set -s user-keys[0] "\e[5;30000~"
set -s user-keys[1] "\e[5;30001~"
set -s user-keys[2] "\e[5;30002~"
set -s user-keys[3] "\e[5;30003~"
set -s user-keys[4] "\e[5;30004~"
set -s user-keys[5] "\e[5;30005~"
set -s user-keys[6] "\e[5;30006~"
set -s user-keys[7] "\e[5;30007~"
set -s user-keys[8] "\e[5;30008~"
bind -n User0 split-window -v -c '#{pane_current_path}'
bind -n User1 split-window -h -c '#{pane_current_path}'
bind -n User2 split-window -v -c '#{pane_current_path}'
bind -n User3 split-window -h -c '#{pane_current_path}'
bind -n User4 swap-pane -d -s : -t '{left-of}'
bind -n User5 swap-pane -d -s : -t '{right-of}'
bind -n User6 swap-pane -d -s : -t '{up-of}'
bind -n User7 swap-pane -d -s : -t '{down-of}'
bind -n User8 resize-pane -Z
