# General
set -g prefix C-a
unbind -q C-b
bind C-a send-prefix
set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/fish
set -as terminal-features ',xterm-kitty:RGB'

# Tabs
set -g status on
set -g status-position top
set -g status-style 'fg=#f8f8f2,bg=#282a36,bold,italics'
set -g message-style 'fg=#282a36,bg=#bd93f9'
set -g status-left ''
set -g status-right '#(python3 "$HOME/.config/kitty/project_state.py" snapshot-all)#[bg=#282a36,fg=#bd93f9,noitalics,nobold]#[bg=#bd93f9,fg=#282a36] #h %H:%M '
set -g status-right-length 100
set -g status-interval 30
set -g window-status-separator ''
set -g window-status-format '#[fg=#282a36,bg=#44475a]#[fg=#f8f8f2,bg=#44475a,italics] #I#{?window_activity_flag, 🔔,} #W #[fg=#44475a,bg=#282a36,noitalics]'
set -g window-status-current-format '#[fg=#282a36] #I #W #[fg=#f8f8f2,bg=#282a36]'
set -g window-status-style 'fg=#f8f8f2,bg=#44475a,italics'
set -g window-status-last-style 'fg=#f8f8f2,bg=#44475a,italics'
set -g window-status-current-style 'fg=#282a36,bg=#f8f8f2,bold,noitalics'
set -g monitor-activity on
set -g window-status-activity-style 'default'
set -g window-status-bell-style 'bold'
set -g clock-mode-colour '#bd93f9'
set -g clock-mode-style 24
bind -r Left select-pane -L
bind -r Right select-pane -R
bind c new-window -c '#{pane_current_path}'
# Keep the standard confirmations, then record a deliberate last-window close.
bind & confirm-before -p "kill-window #W? (y/n)" {
    run-shell 'python3 "$HOME/.config/kitty/project_state.py" mark-close window "#{pane_id}"'
    kill-window
}
set -s user-keys[13] "\e[5;30013~"
set -s user-keys[14] "\e[5;30014~"
bind -n User13 swap-window -d -s : -t '{previous}'
bind -n User14 swap-window -d -s : -t '{next}'

# Panes
set -s user-keys[12] "\e[5;30012~"
bind -n User12 run-shell 'python3 "$HOME/.config/kitty/project_state.py" mark-close pane "#{pane_id}"' \; kill-pane
bind x confirm-before -p "kill-pane #P? (y/n)" {
    run-shell 'python3 "$HOME/.config/kitty/project_state.py" mark-close pane "#{pane_id}"'
    kill-pane
}
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9'
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Proportional sibling sizes on split/close; plain resizes update the baseline.
set-hook -g window-layout-changed {
    if-shell -F '#{==:#{window_zoomed_flag},0}' {
        if-shell -F '#{==:#{@kitty_tmux_proportional_count},#{window_panes}}' {
            set-option -w -F @kitty_tmux_proportional_layout '#{window_layout}'
        } {
            run-shell 'python3 "$HOME/.config/tmux/proportional.py" update "#{window_id}"'
        }
    }
}
run-shell 'python3 "$HOME/.config/tmux/proportional.py" seed-all'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind = select-layout -E

# Resize mode: arrows adjust one cell; Enter or Escape exits.
bind r switch-client -T resize
bind R switch-client -T resize
bind -T resize Left resize-pane -L \; switch-client -T resize
bind -T resize Right resize-pane -R \; switch-client -T resize
bind -T resize Up resize-pane -U \; switch-client -T resize
bind -T resize Down resize-pane -D \; switch-client -T resize
bind -T resize Enter switch-client -T root
bind -T resize Escape switch-client -T root

# Kitty key relay: split, swap, zoom
set -s user-keys[0] "\e[5;30000~"
set -s user-keys[1] "\e[5;30001~"
set -s user-keys[4] "\e[5;30004~"
set -s user-keys[5] "\e[5;30005~"
set -s user-keys[6] "\e[5;30006~"
set -s user-keys[7] "\e[5;30007~"
set -s user-keys[8] "\e[5;30008~"
bind -n User0 split-window -v -c '#{pane_current_path}'
bind -n User1 split-window -h -c '#{pane_current_path}'
bind -n User4 swap-pane -s : -t '{left-of}'
bind -n User5 swap-pane -s : -t '{right-of}'
bind -n User6 swap-pane -s : -t '{up-of}'
bind -n User7 swap-pane -s : -t '{down-of}'
bind -n User8 resize-pane -Z
